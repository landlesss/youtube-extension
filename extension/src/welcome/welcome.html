<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>YouTube Subtitle Downloader</title>
    <link rel="icon" href="icons/icon48.png" />
    <link rel="stylesheet" href="welcome.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <img src="icons/icon128.png" alt="" width="56" height="56" />
        <h1 data-i18n="welcomeTitle"></h1>
        <p class="subtitle" data-i18n="welcomeSubtitle"></p>
      </header>

      <section class="steps">
        <div class="step">
          <span class="step-num">1</span>
          <p data-i18n="welcomeStep1"></p>
        </div>
        <div class="step">
          <span class="step-num">2</span>
          <p data-i18n="welcomeStep2"></p>
        </div>
        <div class="step">
          <span class="step-num">3</span>
          <p data-i18n="welcomeStep3"></p>
        </div>
        <div class="step">
          <span class="step-num">4</span>
          <p data-i18n="welcomeStep4"></p>
        </div>
      </section>

      <section class="translate-card">
        <h2 data-i18n="welcomeTranslateTitle"></h2>
        <p data-i18n="welcomeTranslateText"></p>
      </section>

      <a id="cta" class="cta" href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" data-i18n="welcomeCta"></a>
    </main>
    <script src="welcome.js"></script>
  </body>
</html>
